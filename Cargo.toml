[workspace]
resolver = "2"
members = [
    "moonbridge",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["guyverino"]

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = true
codegen-units = 1
